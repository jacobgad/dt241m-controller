name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  addon-config:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: frenck/action-app-linter@v2.21.1
        with:
          path: ./dt241m-controller

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: dt241m-controller
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: dt241m-controller/go.mod
          cache-dependency-path: dt241m-controller/go.sum
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14.0
          working-directory: dt241m-controller
      - run: go vet ./...
      - run: go test -race -timeout=5m ./...

  image:
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-latest
          - arch: aarch64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: dt241m-controller
          platforms: ${{ matrix.platform }}
          push: false
          build-args: |
            BUILD_VERSION=ci
            BUILD_ARCH=${{ matrix.arch }}
